<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="EKAP İçin E-İmza Kamu İhale Rehberi">
  <defs>
    <linearGradient id="bg-ek" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2540"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <radialGradient id="glow-ek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-ek)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>
  <circle cx="380" cy="315" r="280" fill="url(#glow-ek)"/>
  <!-- Government building + sealed envelope -->
  <g transform="translate(380,315)">
    <!-- Building base -->
    <rect x="-140" y="-50" width="280" height="180" fill="#ffffff"/>
    <!-- Columns -->
    <g fill="#e2e8f0">
      <rect x="-125" y="-50" width="18" height="180"/>
      <rect x="-95" y="-50" width="18" height="180"/>
      <rect x="-65" y="-50" width="18" height="180"/>
      <rect x="-35" y="-50" width="18" height="180"/>
      <rect x="-5" y="-50" width="18" height="180"/>
      <rect x="25" y="-50" width="18" height="180"/>
      <rect x="55" y="-50" width="18" height="180"/>
      <rect x="85" y="-50" width="18" height="180"/>
      <rect x="115" y="-50" width="10" height="180"/>
    </g>
    <!-- Roof/pediment triangle -->
    <polygon points="-160,-50 160,-50 0,-140" fill="#e63946"/>
    <polygon points="-140,-60 140,-60 0,-125" fill="#ffffff"/>
    <!-- star on pediment -->
    <g transform="translate(0,-90)">
      <polygon points="0,-15 4,-4 15,-4 6,3 9,14 0,7 -9,14 -6,3 -15,-4 -4,-4" fill="#e63946"/>
    </g>
    <!-- Base steps -->
    <rect x="-155" y="130" width="310" height="12" fill="#94a3b8"/>
    <rect x="-165" y="142" width="330" height="12" fill="#64748b"/>
    <!-- EKAP label -->
    <rect x="-70" y="60" width="140" height="60" fill="#0a2540"/>
    <text x="0" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#fbbf24">EKAP</text>
  </g>
  <!-- Sealed envelope in corner -->
  <g transform="translate(240,470)">
    <rect x="0" y="0" width="120" height="80" rx="4" fill="#fbbf24" stroke="#0a2540" stroke-width="3"/>
    <path d="M0 0 L60 45 L120 0" stroke="#0a2540" stroke-width="3" fill="none"/>
    <circle cx="100" cy="65" r="15" fill="#e63946"/>
    <text x="100" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#ffffff">✓</text>
  </g>
  <!-- Text -->
  <g transform="translate(680,180)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#fbbf24">KAMU İHALE</text>
    <text x="0" y="65" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff">EKAP İçin</text>
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff" fill-opacity="0.9">E-İmza Rehberi</text>
    <line x1="0" y1="155" x2="120" y2="155" stroke="#e63946" stroke-width="4"/>
    <text x="0" y="195" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" fill-opacity="0.7">E-Teklif · KİK · 4734 sayılı Kanun</text>
    <!-- pill -->
    <g transform="translate(0,230)">
      <rect x="0" y="0" width="360" height="52" rx="26" fill="#e63946"/>
      <text x="180" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Firma E-İmzası + KEP zorunlu</text>
    </g>
  </g>
  <g transform="translate(40,600)">
    <text font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" fill-opacity="0.5">e-imzasatinal.com.tr · UMAY TÜM BİLİŞİM</text>
  </g>
</svg>
