<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Mühendisler İçin E-İmza ve TMMOB">
  <defs>
    <linearGradient id="bg-mh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2540"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <radialGradient id="glow-mh" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-mh)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>
  <circle cx="380" cy="315" r="280" fill="url(#glow-mh)"/>
  <!-- Blueprint + compass + hard hat -->
  <g transform="translate(380,315)">
    <!-- blueprint sheet -->
    <rect x="-130" y="-140" width="260" height="280" rx="8" fill="#ffffff"/>
    <!-- blueprint pattern -->
    <g stroke="#3b82f6" stroke-width="1.5" fill="none">
      <rect x="-110" y="-120" width="220" height="200"/>
      <path d="M-60 -120 V80 M0 -120 V80 M60 -120 V80"/>
      <path d="M-110 -80 H110 M-110 -40 H110 M-110 0 H110 M-110 40 H110"/>
      <!-- diagonal building outline -->
      <path d="M-90 60 L-90 -60 L-30 -100 L30 -100 L90 -60 L90 60 Z" stroke-width="2.5"/>
      <path d="M-90 -60 L90 -60" stroke-width="2"/>
      <!-- door -->
      <rect x="-15" y="20" width="30" height="40"/>
      <!-- windows -->
      <rect x="-70" y="-30" width="25" height="25"/>
      <rect x="45" y="-30" width="25" height="25"/>
    </g>
    <!-- Compass (protractor) icon at top-right -->
    <g transform="translate(90,-90)">
      <circle r="34" fill="#f97316"/>
      <path d="M -20 20 L 0 -22 L 20 20 M -12 8 L 12 8" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="0" cy="-22" r="3" fill="#ffffff"/>
    </g>
    <!-- Ruler -->
    <g transform="translate(-90,110) rotate(-15)">
      <rect x="0" y="-8" width="140" height="16" rx="2" fill="#fbbf24"/>
      <g stroke="#0a2540" stroke-width="1">
        <line x1="15" y1="-8" x2="15" y2="0"/>
        <line x1="30" y1="-8" x2="30" y2="-3"/>
        <line x1="45" y1="-8" x2="45" y2="0"/>
        <line x1="60" y1="-8" x2="60" y2="-3"/>
        <line x1="75" y1="-8" x2="75" y2="0"/>
        <line x1="90" y1="-8" x2="90" y2="-3"/>
        <line x1="105" y1="-8" x2="105" y2="0"/>
        <line x1="120" y1="-8" x2="120" y2="-3"/>
      </g>
    </g>
  </g>
  <!-- Text -->
  <g transform="translate(720,200)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#f97316">MÜHENDİSLER İÇİN</text>
    <text x="0" y="65" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff">E-İmza ve</text>
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff">TMMOB Rehberi</text>
    <line x1="0" y1="155" x2="120" y2="155" stroke="#e63946" stroke-width="4"/>
    <text x="0" y="195" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" fill-opacity="0.7">İMO · EMO · MMO · İSG-KATİP · SMM</text>
    <g transform="translate(0,230)" font-family="Arial, sans-serif" fill="#ffffff">
      <text x="0" y="0" font-size="34" font-weight="900" fill="#f97316">500K+</text>
      <text x="0" y="30" font-size="16">mühendis</text>
      <text x="160" y="0" font-size="34" font-weight="900" fill="#f97316">24 oda</text>
      <text x="160" y="30" font-size="16">TMMOB bünyesinde</text>
    </g>
  </g>
  <g transform="translate(40,600)">
    <text font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" fill-opacity="0.5">e-imzasatinal.com.tr · UMAY TÜM BİLİŞİM</text>
  </g>
</svg>
