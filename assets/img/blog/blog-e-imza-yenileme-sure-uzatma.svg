<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="E-İmza Yenileme ve Süre Uzatma">
  <defs>
    <linearGradient id="bg-yn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2540"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <radialGradient id="glow-yn" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#25d366" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#25d366" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip-yn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-yn)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>
  <circle cx="360" cy="315" r="280" fill="url(#glow-yn)"/>
  <!-- Renewal arrows around card -->
  <g transform="translate(360,315)" fill="none" stroke="#25d366" stroke-width="14" stroke-linecap="round">
    <path d="M -170 -40 A 175 175 0 0 1 120 -128"/>
    <path d="M 170 40 A 175 175 0 0 1 -120 128"/>
  </g>
  <g transform="translate(360,315)" fill="#25d366">
    <polygon points="150,-150 98,-100 140,-92"/>
    <polygon points="-150,150 -98,100 -140,92"/>
  </g>
  <!-- Card -->
  <g transform="translate(360,315)">
    <rect x="-130" y="-80" width="260" height="160" rx="18" fill="#e63946"/>
    <rect x="-95" y="-30" width="62" height="48" rx="6" fill="url(#chip-yn)"/>
    <g stroke="#78350f" stroke-width="2"><line x1="-90" y1="-16" x2="-38" y2="-16"/><line x1="-90" y1="-4" x2="-38" y2="-4"/><line x1="-90" y1="8" x2="-38" y2="8"/></g>
    <text x="10" y="-10" font-family="Arial, sans-serif" font-size="26" font-weight="900" fill="#ffffff">E-İMZA</text>
    <text x="10" y="24" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" fill-opacity="0.85">+3 YIL</text>
  </g>
  <!-- Text -->
  <g transform="translate(680,150)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#25d366">YENİLEME REHBERİ 2026</text>
    <text x="0" y="65" font-family="Arial, sans-serif" font-size="50" font-weight="900" fill="#ffffff">E-İmza Yenileme</text>
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff" fill-opacity="0.9">ve Süre Uzatma</text>
    <line x1="0" y1="155" x2="120" y2="155" stroke="#e63946" stroke-width="4"/>
    <text x="0" y="195" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" fill-opacity="0.7">Fiyat · Süre öğrenme · Firma değiştirme</text>
    <text x="0" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fbbf24">3.000 TL'den başlayan fiyatlar</text>
  </g>
</svg>
