    <radialGradient id="glow-kg" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#60a5fa" stop-opacity="0.45"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-kg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
