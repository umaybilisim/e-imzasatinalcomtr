<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="E-İmza ile e-Devlet Girişi">
  <defs>
    <linearGradient id="bg-ed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2540"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="redbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e63946"/>
      <stop offset="1" stop-color="#b71c2c"/>
    </linearGradient>
    <radialGradient id="lock-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-ed)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>
  <circle cx="400" cy="315" r="280" fill="url(#lock-glow)"/>
  <!-- Portal door / gateway -->
  <g transform="translate(400,315)">
    <!-- arch -->
    <path d="M -140 100 V -80 A 140 140 0 0 1 140 -80 V 100 Z" fill="#ffffff" fill-opacity="0.05" stroke="#e63946" stroke-width="6"/>
    <!-- red moon + star (subtle Turk flag accent) -->
    <g transform="translate(0,-30)">
      <circle r="70" fill="url(#redbar)"/>
      <circle cx="-20" cy="0" r="55" fill="#0a2540"/>
      <g transform="translate(35,0)">
        <polygon points="0,-20 6,-6 22,-6 9,3 14,18 0,9 -14,18 -9,3 -22,-6 -6,-6" fill="#ffffff"/>
      </g>
    </g>
    <!-- key -->
    <g transform="translate(0,75)">
      <circle r="22" fill="none" stroke="#fbbf24" stroke-width="6"/>
      <rect x="-3" y="20" width="6" height="50" fill="#fbbf24"/>
      <rect x="-15" y="55" width="12" height="6" fill="#fbbf24"/>
      <rect x="-15" y="65" width="8" height="6" fill="#fbbf24"/>
    </g>
  </g>
  <!-- Text -->
  <g transform="translate(720,200)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#fbbf24">ADIM ADIM REHBER</text>
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="58" font-weight="900" fill="#ffffff">E-İmza ile</text>
    <text x="0" y="135" font-family="Arial, sans-serif" font-size="58" font-weight="900" fill="#ffffff">e-Devlet'e Giriş</text>
    <line x1="0" y1="170" x2="120" y2="170" stroke="#e63946" stroke-width="4"/>
    <text x="0" y="210" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#ffffff" fill-opacity="0.7">turkiye.gov.tr · AKİS · PIN · 5 Dakikada</text>
    <!-- step pills -->
    <g transform="translate(0,250)" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">
      <g transform="translate(0,0)"><circle cx="20" cy="20" r="20" fill="#10b981"/><text x="20" y="26" text-anchor="middle">1</text><text x="55" y="26">AKİS</text></g>
      <g transform="translate(150,0)"><circle cx="20" cy="20" r="20" fill="#3b82f6"/><text x="20" y="26" text-anchor="middle">2</text><text x="55" y="26">USB</text></g>
      <g transform="translate(290,0)"><circle cx="20" cy="20" r="20" fill="#e63946"/><text x="20" y="26" text-anchor="middle">3</text><text x="55" y="26">PIN</text></g>
    </g>
  </g>
  <g transform="translate(40,580)">
    <text font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" fill-opacity="0.5">e-imzasatinal.com.tr · UMAY TÜM BİLİŞİM</text>
  </g>
</svg>
