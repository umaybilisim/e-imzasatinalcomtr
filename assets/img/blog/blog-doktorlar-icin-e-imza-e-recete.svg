<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Doktorlar İçin E-İmza ve E-Reçete">
  <defs>
    <linearGradient id="bg-dr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2540"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <radialGradient id="pulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-dr)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>
  <circle cx="380" cy="315" r="280" fill="url(#pulse)"/>
  <!-- Medical cross + prescription pad -->
  <g transform="translate(380,315)">
    <!-- prescription pad -->
    <rect x="-110" y="-130" width="220" height="260" rx="12" fill="#ffffff"/>
    <rect x="-110" y="-130" width="220" height="45" rx="12" fill="#e63946"/>
    <rect x="-110" y="-100" width="220" height="15" fill="#e63946"/>
    <text x="-90" y="-100" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#ffffff">℞ E-REÇETE</text>
    <!-- lines -->
    <g stroke="#cbd5e1" stroke-width="2">
      <line x1="-90" y1="-60" x2="90" y2="-60"/>
      <line x1="-90" y1="-40" x2="90" y2="-40"/>
      <line x1="-90" y1="-20" x2="60" y2="-20"/>
      <line x1="-90" y1="10" x2="90" y2="10"/>
      <line x1="-90" y1="30" x2="70" y2="30"/>
      <line x1="-90" y1="50" x2="90" y2="50"/>
    </g>
    <!-- signature -->
    <path d="M -85 90 Q -60 75 -35 95 T 15 90 Q 40 100 65 80 Q 80 92 90 78" stroke="#0a2540" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- medical cross on top of pad -->
    <g transform="translate(140,-90)">
      <circle r="34" fill="#22c55e"/>
      <rect x="-5" y="-20" width="10" height="40" fill="#ffffff"/>
      <rect x="-20" y="-5" width="40" height="10" fill="#ffffff"/>
    </g>
  </g>
  <!-- Text -->
  <g transform="translate(720,200)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#22c55e">HEKİMLER İÇİN</text>
    <text x="0" y="65" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff">Doktorlar İçin</text>
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff" fill-opacity="0.9">E-İmza &amp; E-Reçete</text>
    <line x1="0" y1="155" x2="120" y2="155" stroke="#e63946" stroke-width="4"/>
    <text x="0" y="195" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" fill-opacity="0.7">MEDULA · HBYS · Muayenehane · 2026</text>
    <!-- stats -->
    <g transform="translate(0,235)" font-family="Arial, sans-serif" fill="#ffffff">
      <text x="0" y="0" font-size="34" font-weight="900" fill="#22c55e">200K+</text>
      <text x="0" y="30" font-size="16">hekim + eczacı</text>
      <text x="160" y="0" font-size="34" font-weight="900" fill="#22c55e">100+ sa</text>
      <text x="160" y="30" font-size="16">yıllık tasarruf</text>
    </g>
  </g>
  <g transform="translate(40,600)">
    <text font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" fill-opacity="0.5">e-imzasatinal.com.tr · UMAY TÜM BİLİŞİM</text>
  </g>
</svg>
