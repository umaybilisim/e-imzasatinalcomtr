<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Mali Mühür ve E-İmza Farkı">
  <defs>
    <linearGradient id="bg-mm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2540"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="seal-mm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e63946"/>
      <stop offset="1" stop-color="#b71c2c"/>
    </linearGradient>
    <radialGradient id="glow-mm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-mm)"/>
  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630"/>
  </g>
  <!-- glow -->
  <circle cx="380" cy="315" r="280" fill="url(#glow-mm)"/>
  <!-- Stamp/seal -->
  <g transform="translate(380,315)">
    <!-- outer ring -->
    <circle r="170" fill="none" stroke="url(#seal-mm)" stroke-width="14"/>
    <circle r="145" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="4 8"/>
    <!-- inner -->
    <circle r="110" fill="url(#seal-mm)"/>
    <!-- chip lines suggesting digital -->
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
      <path d="M-60 -30 H-30 M-60 0 H-20 M-60 30 H-30"/>
      <path d="M30 -30 H60 M20 0 H60 M30 30 H60"/>
      <path d="M-20 -30 V-50 M0 -30 V-60 M20 -30 V-50"/>
      <path d="M-20 30 V50 M0 30 V60 M20 30 V50"/>
    </g>
    <!-- center icon: pen nib + chip -->
    <rect x="-22" y="-22" width="44" height="44" rx="4" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#0a2540">M</text>
  </g>
  <!-- Text block -->
  <g transform="translate(720,200)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="#fbbf24">2026 REHBERİ</text>
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="58" font-weight="900" fill="#ffffff">Mali Mühür</text>
    <text x="0" y="135" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#ffffff" fill-opacity="0.9">Nedir? E-İmza ile Farkı</text>
    <line x1="0" y1="170" x2="120" y2="170" stroke="#e63946" stroke-width="4"/>
    <text x="0" y="210" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#ffffff" fill-opacity="0.7">GİB · E-Fatura · 5070 sayılı Kanun</text>
    <!-- comparison badges -->
    <g transform="translate(0,255)">
      <rect x="0" y="0" width="180" height="50" rx="25" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="90" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">E-İMZA (NES)</text>
      <text x="200" y="32" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fbbf24">vs</text>
      <rect x="245" y="0" width="200" height="50" rx="25" fill="#e63946" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="345" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">MALİ MÜHÜR</text>
    </g>
  </g>
  <!-- brand tag -->
  <g transform="translate(40,580)">
    <text font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" fill-opacity="0.5">e-imzasatinal.com.tr · UMAY TÜM BİLİŞİM</text>
  </g>
</svg>
