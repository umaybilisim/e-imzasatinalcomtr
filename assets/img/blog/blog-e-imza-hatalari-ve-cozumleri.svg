<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="E-İmza Hataları ve Çözümleri">
  <defs>
    <linearGradient id="bg-ht" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2540"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <radialGradient id="glow-ht" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-ht)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>
  <circle cx="360" cy="315" r="280" fill="url(#glow-ht)"/>
  <!-- Laptop -->
  <g transform="translate(360,300)">
    <rect x="-200" y="-140" width="400" height="250" rx="14" fill="#0f172a" stroke="#94a3b8" stroke-width="6"/>
    <rect x="-240" y="110" width="480" height="22" rx="8" fill="#94a3b8"/>
    <!-- Error dialog -->
    <rect x="-150" y="-100" width="300" height="150" rx="10" fill="#ffffff"/>
    <rect x="-150" y="-100" width="300" height="34" rx="10" fill="#e63946"/>
    <rect x="-150" y="-80" width="300" height="14" fill="#e63946"/>
    <circle cx="-110" cy="0" r="24" fill="#fbbf24"/>
    <rect x="-113" y="-14" width="6" height="18" fill="#0a2540"/>
    <circle cx="-110" cy="12" r="3.5" fill="#0a2540"/>
    <rect x="-72" y="-14" width="190" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="-72" y="4" width="140" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="40" y="22" width="80" height="20" rx="6" fill="#25d366"/>
    <!-- USB token -->
    <g transform="translate(240,40) rotate(-20)">
      <rect x="0" y="-18" width="90" height="36" rx="8" fill="#e63946"/>
      <rect x="-24" y="-11" width="26" height="22" fill="#cbd5e1"/>
    </g>
  </g>
  <!-- Wrench check -->
  <g transform="translate(170,500)">
    <circle r="44" fill="#25d366"/>
    <path d="M -18 0 L -4 14 L 20 -14" stroke="#ffffff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Text -->
  <g transform="translate(680,150)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#60a5fa">SORUN GİDERME</text>
    <text x="0" y="65" font-family="Arial, sans-serif" font-size="50" font-weight="900" fill="#ffffff">E-İmza Hataları</text>
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff" fill-opacity="0.9">ve Çözümleri</text>
    <line x1="0" y1="155" x2="120" y2="155" stroke="#e63946" stroke-width="4"/>
    <text x="0" y="195" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" fill-opacity="0.7">Kart görünmüyor · Java · Sürücü · PIN</text>
    <text x="0" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#25d366">Uzaktan destekle birlikte çözelim</text>
  </g>
</svg>
