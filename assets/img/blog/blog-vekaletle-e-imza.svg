<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Vekaletle E-İmza Alınabilir Mi? Hukuki Çerçeve">
  <defs>
    <linearGradient id="bg-vk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2540"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <radialGradient id="q-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e63946" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e63946" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-vk)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>
  <circle cx="400" cy="315" r="280" fill="url(#q-glow)"/>
  <!-- Document with signature line + giant question mark -->
  <g transform="translate(280,165)">
    <!-- folder/document -->
    <rect width="240" height="320" rx="12" fill="#ffffff"/>
    <rect width="240" height="40" rx="12" fill="#e63946"/>
    <rect y="20" width="240" height="20" fill="#e63946"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">VEKALETNAME</text>
    <!-- lines -->
    <g stroke="#cbd5e1" stroke-width="2">
      <line x1="20" y1="65" x2="220" y2="65"/>
      <line x1="20" y1="85" x2="220" y2="85"/>
      <line x1="20" y1="105" x2="180" y2="105"/>
      <line x1="20" y1="135" x2="220" y2="135"/>
      <line x1="20" y1="155" x2="200" y2="155"/>
    </g>
    <!-- signature placeholder -->
    <text x="20" y="210" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">İmza:</text>
    <path d="M 50 235 Q 70 215 90 235 T 130 235 Q 145 220 165 230 Q 175 240 200 220" stroke="#0a2540" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- stamp -->
    <g transform="translate(180,275)">
      <circle r="28" fill="none" stroke="#e63946" stroke-width="3"/>
      <text y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#e63946">NOTER</text>
    </g>
  </g>
  <!-- giant question mark -->
  <g transform="translate(620,330)">
    <text font-family="Arial, sans-serif" font-size="320" font-weight="900" fill="#fbbf24" fill-opacity="0.15" text-anchor="middle">?</text>
  </g>
  <!-- Text -->
  <g transform="translate(560,180)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#fbbf24">HUKUKİ ÇERÇEVE</text>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff">Vekaletle</text>
    <text x="0" y="118" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff">E-İmza Alınır Mı?</text>
    <line x1="0" y1="150" x2="120" y2="150" stroke="#e63946" stroke-width="4"/>
    <text x="0" y="190" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" fill-opacity="0.7">5070 sayılı Kanun · Noter · ESHS</text>
    <!-- pill answer -->
    <g transform="translate(0,230)">
      <rect width="290" height="56" rx="28" fill="#e63946"/>
      <text x="145" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">GENELDE HAYIR · İSTİSNALAR VAR</text>
    </g>
  </g>
  <g transform="translate(40,600)">
    <text font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" fill-opacity="0.5">e-imzasatinal.com.tr · UMAY TÜM BİLİŞİM</text>
  </g>
</svg>
