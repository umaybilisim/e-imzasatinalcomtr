<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Muhasebeciler İçin E-İmza Paketleri">
  <defs>
    <linearGradient id="bg-mh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2540"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="bar-gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fde047"/>
    </linearGradient>
    <radialGradient id="calc-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-mh)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>
  <circle cx="380" cy="315" r="280" fill="url(#calc-glow)"/>
  <!-- Calculator -->
  <g transform="translate(260,180)">
    <rect width="240" height="320" rx="20" fill="#ffffff"/>
    <rect x="20" y="20" width="200" height="60" rx="8" fill="#0a2540"/>
    <text x="210" y="60" text-anchor="end" font-family="Courier New, monospace" font-size="32" font-weight="700" fill="#10b981">1.250 ₺</text>
    <!-- buttons grid -->
    <g font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
      <rect x="20" y="100" width="42" height="42" rx="6" fill="#e2e8f0"/><text x="41" y="128" fill="#0a2540">7</text>
      <rect x="72" y="100" width="42" height="42" rx="6" fill="#e2e8f0"/><text x="93" y="128" fill="#0a2540">8</text>
      <rect x="124" y="100" width="42" height="42" rx="6" fill="#e2e8f0"/><text x="145" y="128" fill="#0a2540">9</text>
      <rect x="176" y="100" width="42" height="42" rx="6" fill="#e63946"/><text x="197" y="128" fill="#ffffff">÷</text>
      <rect x="20" y="150" width="42" height="42" rx="6" fill="#e2e8f0"/><text x="41" y="178" fill="#0a2540">4</text>
      <rect x="72" y="150" width="42" height="42" rx="6" fill="#e2e8f0"/><text x="93" y="178" fill="#0a2540">5</text>
      <rect x="124" y="150" width="42" height="42" rx="6" fill="#e2e8f0"/><text x="145" y="178" fill="#0a2540">6</text>
      <rect x="176" y="150" width="42" height="42" rx="6" fill="#e63946"/><text x="197" y="178" fill="#ffffff">×</text>
      <rect x="20" y="200" width="42" height="42" rx="6" fill="#e2e8f0"/><text x="41" y="228" fill="#0a2540">1</text>
      <rect x="72" y="200" width="42" height="42" rx="6" fill="#e2e8f0"/><text x="93" y="228" fill="#0a2540">2</text>
      <rect x="124" y="200" width="42" height="42" rx="6" fill="#e2e8f0"/><text x="145" y="228" fill="#0a2540">3</text>
      <rect x="176" y="200" width="42" height="42" rx="6" fill="#e63946"/><text x="197" y="228" fill="#ffffff">−</text>
      <rect x="20" y="250" width="94" height="42" rx="6" fill="#e2e8f0"/><text x="67" y="278" fill="#0a2540">0</text>
      <rect x="124" y="250" width="42" height="42" rx="6" fill="#e2e8f0"/><text x="145" y="278" fill="#0a2540">.</text>
      <rect x="176" y="250" width="42" height="42" rx="6" fill="#10b981"/><text x="197" y="278" fill="#ffffff">=</text>
    </g>
  </g>
  <!-- Bar chart -->
  <g transform="translate(560,420)">
    <rect x="0" y="-40" width="20" height="40" fill="url(#bar-gold)" rx="2"/>
    <rect x="30" y="-70" width="20" height="70" fill="url(#bar-gold)" rx="2"/>
    <rect x="60" y="-95" width="20" height="95" fill="url(#bar-gold)" rx="2"/>
    <rect x="90" y="-130" width="20" height="130" fill="url(#bar-gold)" rx="2"/>
    <line x1="-5" y1="0" x2="120" y2="0" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
  </g>
  <!-- Text -->
  <g transform="translate(560,200)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#fbbf24">SMMM · YMM</text>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff">Muhasebeciler</text>
    <text x="0" y="118" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#ffffff" fill-opacity="0.9">İçin E-İmza Paketleri</text>
    <line x1="0" y1="150" x2="120" y2="150" stroke="#e63946" stroke-width="4"/>
    <text x="0" y="190" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" fill-opacity="0.7">GİB · SGK · MERSİS · e-Defter · 2026</text>
  </g>
  <g transform="translate(40,600)">
    <text font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" fill-opacity="0.5">e-imzasatinal.com.tr · UMAY TÜM BİLİŞİM</text>
  </g>
</svg>
